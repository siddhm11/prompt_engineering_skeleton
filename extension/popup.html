<!DOCTYPE html>
<html>

<head>
    <title>Prompt Memory</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 300px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            padding: 24px;
            background: #ffffff;
            color: #1a1a1e;
        }

        .pm-logo {
            font-size: 16px;
            font-weight: 600;
            color: #2a8a7a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pm-logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #e8f5f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        p {
            font-size: 13px;
            color: #6b6b76;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .shortcut {
            display: inline-block;
            background: #f7f7f8;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #e2e2e5;
            font-size: 11px;
            font-weight: 500;
            color: #1a1a1e;
            font-family: inherit;
        }

        .status-card {
            background: #f7f7f8;
            border-radius: 8px;
            padding: 14px;
            margin-top: 12px;
        }

        .status-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #9d9da8;
            margin-bottom: 4px;
        }

        .status-value {
            font-size: 13px;
            color: #1a1a1e;
            font-weight: 500;
        }

        .status-value.logged-in {
            color: #2a8a7a;
        }

        .status-value.logged-out {
            color: #c0392b;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="pm-logo">
        <div class="pm-logo-icon">⊕</div>
        Prompt Memory
    </div>

    <p>
        Navigate to any supported AI chat page
        (ChatGPT, Claude, Gemini, Perplexity, Grok)
        and click the <strong>⊕</strong> floating button to open the sidebar.
    </p>

    <p>
        Login, enhance prompts, and manage your history — all from the sidebar.
    </p>

    <p>
        Shortcut: <span class="shortcut">Ctrl+Shift+E</span> to enhance instantly.
    </p>

    <div class="status-card">
        <div class="status-label">Status</div>
        <div class="status-value" id="status-value">Checking...</div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
