<!DOCTYPE html>
<html>

<head>
    <title>Prompt Memory</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 320px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
            background: #ffffff;
            color: #1a1a1e;
        }

        .pm-logo {
            font-size: 16px;
            font-weight: 600;
            color: #2a8a7a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pm-logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #e8f5f2 0%, #d0ede8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .pm-logo-version {
            font-size: 10px;
            font-weight: 600;
            color: #2a8a7a;
            background: #e8f5f2;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: auto;
        }

        p {
            font-size: 13px;
            color: #6b6b76;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e2e5;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            color: #1a1a1e;
            outline: none;
            margin-bottom: 10px;
            transition: border-color 180ms ease;
        }

        input:focus {
            border-color: #2a8a7a;
        }

        input::placeholder {
            color: #9d9da8;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 180ms ease, opacity 180ms ease, transform 120ms ease;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-primary {
            background: #2a8a7a;
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: #238073;
        }

        .btn-google {
            background: #fff;
            color: #1a1a1e;
            border: 1px solid #e2e2e5;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-google:hover:not(:disabled) {
            background: #f7f7f8;
            border-color: #d0d0d5;
        }

        .btn-danger {
            background: #c0392b;
            color: #fff;
            margin-top: 12px;
        }

        .btn-danger:hover:not(:disabled) {
            background: #a93226;
        }

        .divider {
            text-align: center;
            font-size: 12px;
            color: #9d9da8;
            margin: 12px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ececef;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .back-link {
            font-size: 12px;
            color: #2a8a7a;
            text-align: center;
            cursor: pointer;
            margin-top: 10px;
            display: block;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #6b6b76;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        /* Profile section */
        .profile-card {
            background: #f7f7f8;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .profile-email {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1e;
            margin-bottom: 4px;
        }

        .profile-id {
            font-size: 11px;
            color: #9d9da8;
            word-break: break-all;
            margin-bottom: 12px;
        }

        .profile-tip {
            font-size: 12px;
            color: #6b6b76;
            background: linear-gradient(135deg, #e8f5f2 0%, #f0faf8 100%);
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            line-height: 1.6;
            border: 1px solid #d0ede8;
        }

        .profile-tip kbd {
            background: #fff;
            padding: 2px 5px;
            border-radius: 3px;
            border: 1px solid #d0d0d5;
            font-size: 11px;
            font-family: inherit;
        }

        .profile-shortcuts {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .shortcut-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #6b6b76;
        }

        .shortcut-row kbd {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #d0d0d5;
            font-size: 11px;
            font-family: inherit;
            color: #1a1a1e;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="pm-logo">
        <div class="pm-logo-icon">⊕</div>
        Prompt Memory
        <span class="pm-logo-version">v4</span>
    </div>

    <div id="login-section">
        <!-- Step 1: Email -->
        <div id="step-1">
            <p>Enter your email to receive a login code.</p>
            <input type="email" id="email" placeholder="you@example.com" />
            <button class="btn-primary" id="send-otp-btn">Send Code</button>
            <div class="divider">or</div>
            <button class="btn-google" id="google-login-btn">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Sign in with Google
            </button>
        </div>

        <!-- Step 2: OTP -->
        <div id="step-2" class="hidden">
            <p>Enter the 6-digit code from your email.</p>
            <input type="text" id="otp-code" placeholder="123456" maxlength="6" />
            <button class="btn-primary" id="verify-otp-btn">Verify & Login</button>
            <span class="back-link" id="back-to-email">← Back to email</span>
        </div>
    </div>

    <div id="profile-section" class="hidden">
        <div class="profile-card">
            <div class="profile-email" id="user-display"></div>
            <div class="profile-id" id="uuid-display"></div>
            <div class="profile-tip">
                Open any AI chat (ChatGPT, Claude, Gemini, etc.) and use the shortcuts below:
            </div>
            <div class="profile-shortcuts">
                <div class="shortcut-row">
                    <span>Enhance prompt</span>
                    <kbd>Ctrl+Shift+E</kbd>
                </div>
                <div class="shortcut-row">
                    <span>Voice to prompt</span>
                    <kbd>Ctrl+Shift+V</kbd>
                </div>
            </div>
            <button class="btn-danger" id="logout-btn">Log Out</button>
        </div>
    </div>

    <p id="status"></p>

    <script src="popup.js"></script>
</body>

</html>
